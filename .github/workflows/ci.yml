name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: bcmath, ctype, curl, dom, exif, fileinfo, gd, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml, zip

jobs:
  quality:
    name: Style, static analysis, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Dependency audit
        run: composer audit --locked

  tests-sqlite:
    name: Tests (SQLite, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run tests
        run: php artisan test

  tests-mysql:
    name: Tests (MySQL 8.4, PHP 8.3)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: marketplace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Job-level env takes precedence over phpunit.xml <env> defaults (not forced).
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: marketplace_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-8.3-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run migrations against MySQL
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test
